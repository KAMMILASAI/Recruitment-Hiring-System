<template>
    <lightning-card title="Application History">

        <template if:true={applications}>
            <lightning-datatable
                key-field="Id"
                data={applications}
                columns={columns}>
            </lightning-datatable>
        </template>

        <template if:true={noData}>
            <div class="slds-p-around_medium">
                No applications found.
            </div>
        </template>

    </lightning-card>
</template>
