<template>

    <lightning-card title="Candidate Job Board">

        <div class="slds-p-around_medium">
            <template if:false={showJobs}>
                <lightning-input
                    label="Email"
                    type="email"
                    onchange={handleEmailChange}>
                </lightning-input>
                <lightning-button
                    label="Login"
                    variant="brand"
                    onclick={login}>
                </lightning-button>

            </template>

            <template if:true={showJobs}>
                <template for:each={jobs} for:item="job">
                    <div key={job.Id}
                         class="slds-box slds-m-around_small">
                        <h2>
                            {job.Name}
                        </h2>
                        <p>
                            Role:
                            {job.Role__c}
                        </p>
                        <p>
                            Experience:
                            {job.Experience__c}
                        </p>
                        <p>
                            Skills:
                            {job.Skills__c}
                        </p>
                        <p>
                            Salary:
                            <lightning-formatted-number
                                value={job.Minimum_Salary__c}
                                format-style="currency">
                            </lightning-formatted-number>

                            -

                            <lightning-formatted-number
                                value={job.Maximum_Salary__c}
                                format-style="currency">
                            </lightning-formatted-number>
                        </p>

                        <lightning-button
                            label={job.buttonLabel}
                            data-id={job.Id}
                            disabled={job.disabled}
                            onclick={handleApply}>
                        </lightning-button>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
