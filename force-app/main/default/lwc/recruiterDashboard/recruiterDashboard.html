<template>

<lightning-card title="Recruiter Dashboard">

<div class="slds-grid slds-wrap slds-p-around_medium">
    <div class="slds-col slds-size_1-of-4">
        <lightning-card title="Total Applications">

            <h1 class="slds-text-align_center">
            {totalApplications}
            </h1>

        </lightning-card>
    </div>
    <div class="slds-col slds-size_1-of-4">
        <lightning-card title="Upcoming Interviews">
            <h1 class="slds-text-align_center">
            {upcomingInterviews}
            </h1>
        </lightning-card>
    </div>
</div>

<lightning-card title="Application Status">
        <div class="slds-p-around_medium">
            <template for:each={statusList} for:item="item">
                <p key={item.status}>
                <b>{item.status}</b> : {item.count}
                </p>
            </template>
        </div>
        </lightning-card>
                <lightning-card title="Recent Applications">
                    <lightning-datatable
                    key-field="Id"
                    data={applications}
                    columns={columns}>
                    </lightning-datatable>
                </lightning-card>
        </lightning-card>
</template>
