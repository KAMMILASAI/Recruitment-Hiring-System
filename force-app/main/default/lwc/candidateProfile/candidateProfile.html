<template>
    <lightning-card title="Candidate Profile">

        <template if:true={candidateExists}>
            
            <template if:false={isEditMode}>
                
                <lightning-record-view-form 
                    object-api-name="Candidate__c" 
                    record-id={recordId}>

                    <div class="slds-p-around_medium">

                        <lightning-output-field field-name="Name"></lightning-output-field>
                        <lightning-output-field field-name="Email__c"></lightning-output-field>
                        <lightning-output-field field-name="Phone__c"></lightning-output-field>
                        <lightning-output-field field-name="Experience__c"></lightning-output-field>
                        <lightning-output-field field-name="Skills__c"></lightning-output-field>

                        <div class="slds-m-top_medium">
                            <lightning-button 
                                label="Edit" 
                                onclick={handleEdit}
                                variant="brand">
                            </lightning-button>
                        </div>

                    </div>
                </lightning-record-view-form>

            </template>

            <template if:true={isEditMode}>

                <lightning-record-edit-form 
                    object-api-name="Candidate__c"
                    record-id={recordId}
                    onsuccess={handleSuccess}>

                    <lightning-messages></lightning-messages>

                    <lightning-input-field field-name="Name"></lightning-input-field>
                    <lightning-input-field field-name="Email__c"></lightning-input-field>
                    <lightning-input-field field-name="Phone__c"></lightning-input-field>
                    <lightning-input-field field-name="Experience__c"></lightning-input-field>
                    <lightning-input-field field-name="Skills__c"></lightning-input-field>

                    <div class="slds-m-top_medium">
                        <lightning-button type="submit" label="Save" variant="brand"></lightning-button>
                        <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-left_small"></lightning-button>
                    </div>

                </lightning-record-edit-form>

            </template>

        </template>

        <template if:false={candidateExists}>
            
            <lightning-record-edit-form 
                object-api-name="Candidate__c"
                onsuccess={handleCreateSuccess}>

                <lightning-messages></lightning-messages>

                <lightning-input-field field-name="Name"></lightning-input-field>
                <lightning-input-field field-name="Email__c"></lightning-input-field>
                <lightning-input-field field-name="Phone__c"></lightning-input-field>
                <lightning-input-field field-name="Experience__c"></lightning-input-field>
                <lightning-input-field field-name="Skills__c"></lightning-input-field>

                <lightning-input-field 
                    field-name="User__c" 
                    value={userId}>
                </lightning-input-field>

                <div class="slds-m-top_medium">
                    <lightning-button type="submit" label="Create Profile" variant="brand"></lightning-button>
                </div>

            </lightning-record-edit-form>

        </template>

    </lightning-card>
</template>
